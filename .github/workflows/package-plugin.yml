name: Release Plugin Zip

on:
  push:
    tags:
      - 'v*'

jobs:
  quality:
    uses: ./.github/workflows/quality.yml
    permissions:
      actions: write
      contents: read
      pull-requests: write

  zip:
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Resolve release metadata
        id: release_meta
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES_FILE="release-notes/${VERSION}.md"
          if [[ ! -f "$NOTES_FILE" ]]; then
            echo "Missing release notes file: $NOTES_FILE"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "notes_file=$NOTES_FILE" >> "$GITHUB_OUTPUT"

      - name: Build plugin package
        id: build
        run: |
          chmod +x build.sh
          ZIP_PATH="$(./build.sh | sed -n 's/^Created //p')"
          if [[ -z "$ZIP_PATH" || ! -f "$ZIP_PATH" ]]; then
            echo "Failed to locate built zip file."
            exit 1
          fi
          ZIP_DIR="$(dirname "$ZIP_PATH")"
          ZIP_NAME="$(basename "$ZIP_PATH")"
          (cd "$ZIP_DIR" && sha256sum "$ZIP_NAME" > "$ZIP_NAME.sha256")
          echo "zip_path=$ZIP_PATH" >> "$GITHUB_OUTPUT"

      - name: Attest plugin package
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: ${{ steps.build.outputs.zip_path }}

      - name: Create GitHub release and upload asset
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            ${{ steps.build.outputs.zip_path }}
            ${{ steps.build.outputs.zip_path }}.sha256
          body_path: ${{ steps.release_meta.outputs.notes_file }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
