version: 2
updates:
  # Workflow actions are pinned to commit SHAs; Dependabot bumps the SHA and its version comment.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"

  # Development-only tooling. build.sh excludes vendor/ and Composer metadata from the release zip.
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      composer-dev:
        dependency-type: "development"
